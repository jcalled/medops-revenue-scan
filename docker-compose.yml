services:
  api:
    build: .
    env_file: .env
    environment:
      EVIDENCE_ARCHIVE_DIR: /data/evidence
    volumes:
      - revenue-evidence:/data/evidence
    ports:
      - "8100:8100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  revenue-evidence:
